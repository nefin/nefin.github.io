baseURL = "https://nefin.com.br/"
locale = "en-us"
title = "NEFIN"
removePathAccents = true

[params]
  tagline    = "Center for Research in Financial Economics"
  description = "Center for Research in Financial Economics of the University of São Paulo"
  email      = "nefin@usp.br"
  phone      = "+55 11 3093 0957"
  address    = "Department of Economics – FEA, Prof. Luciano Gualberto Ave., Cidade Universitária, FEA I, 05508-900, São Paulo, SP – Brazil"
  googleAnalytics = "G-60RY20MC3F"
  mission    = "NEFIN is the Brazilian Center for Research in Financial Economics of the University of São Paulo. We advance knowledge in asset pricing, derivative pricing, corporate finance, risk management and portfolio allocation — and make our data freely available to academics and practitioners."

[permalinks]
  # :slugorcontentbasename — the filename drives the URL, and an explicit `slug:` in the
  # front matter can still override it. Plain :slug falls back to the *title*, which
  # meant renaming a post silently changed nothing and retitling it broke the URL.
  datasets = "/data/:slugorcontentbasename/"
  insights = "/insights/:slugorcontentbasename/"

[taxonomies]
  topic = "topics"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[minify]
  # `hugo --minify` strips HTML comments by default, which would drop the
  # `advisor_hidden` names the Alumni table deliberately keeps in the source.
  [minify.tdewolff.html]
    keepComments = true
