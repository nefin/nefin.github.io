<!DOCTYPE html>
{{/* Insights posts declare their own language; everything else is English. */}}
<html lang="{{ if eq (.Params.language | default "en") "pt" }}pt-BR{{ else }}en{{ end }}">
<head>{{ partial "head.html" . }}</head>
<body>
  <a href="#main" class="skip-link">Skip to content</a>
  {{ partial "nav.html" . }}
  <main id="main" tabindex="-1">{{ block "main" . }}{{ end }}</main>
  {{ partial "footer.html" . }}
  {{ if .Params.math }}
  <script defer src="/vendor/katex/katex.min.js"></script>
  <script defer src="/vendor/katex/auto-render.min.js"></script>
  <script>
  {{/* \( \) and \[ \] only — never $ ... $, which collides with plain dollar
       amounts ("$100") that show up all over a finance site. */}}
  document.addEventListener('DOMContentLoaded', function () {
    renderMathInElement(document.body, {
      delimiters: [
        {left: '\\(', right: '\\)', display: false},
        {left: '\\[', right: '\\]', display: true}
      ],
      throwOnError: false
    });
  });
  </script>
  {{ end }}
</body>
</html>
