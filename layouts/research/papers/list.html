{{ define "main" }}
<section class="page-header">
  <div class="container">
    <h1>{{ .Title }}</h1>
    <p>Peer-reviewed articles by NEFIN researchers</p>
  </div>
</section>

<section class="section">
  <div class="container">
    {{ partial "research-tabs.html" . }}
    <ul class="pub-list">
      {{ range .Pages }}
      <li class="pub-item">
        <a href="{{ .Params.paper_url | default "#" }}" target="_blank" rel="noopener">
          <div class="pub-title">{{ .Title }}</div>
          <div class="pub-journal">{{ .Params.journal }}{{ with .Params.year }} · {{ . }}{{ end }}</div>
          <div class="pub-authors">{{ .Params.authors }}</div>
        </a>
      </li>
      {{ end }}
    </ul>
  </div>
</section>
{{ end }}
