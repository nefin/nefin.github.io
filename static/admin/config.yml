# ============================================================
# Decap CMS — NEFIN configuration
# ============================================================
# Setup instructions:
#   1. Go to GitHub → Settings → Developer settings → OAuth Apps → New
#   2. Set Authorization callback URL to: https://nefin.com.br/api/auth
#   3. Create a free Netlify site connected to this repo
#   4. Enable Netlify Identity on that site and set External Provider = GitHub
#   5. Update base_url below with your Netlify site URL
# ============================================================

backend:
  name: git-gateway
  branch: main
  identity_url: https://illustrious-moonbeam-ccac5a.netlify.app/.netlify/identity
  gateway_url: https://illustrious-moonbeam-ccac5a.netlify.app/.netlify/git/github

# For local development: run `npx decap-server` and uncomment:
# local_backend: true

media_folder: "static/img/uploads"
public_folder: "/img/uploads"

collections:

  # ── Faculty ────────────────────────────────────────────────
  - name: "faculty"
    label: "Faculty"
    label_singular: "Faculty Member"
    folder: "content/people/faculty"
    create: true
    slug: "{{slug}}"
    identifier_field: "title"
    fields:
      - { label: "Full Name", name: "title", widget: "string" }
      - { label: "PhD", name: "phd", widget: "string", hint: "e.g. PhD in Economics" }
      - { label: "Institution (PhD)", name: "institution", widget: "string" }
      - { label: "Photo", name: "photo", widget: "image", required: false }
      - { label: "Personal Website URL", name: "personal_url", widget: "string", required: false }
      - { label: "Display Order", name: "weight", widget: "number", default: 99 }

  # ── Researchers ────────────────────────────────────────────
  - name: "researchers"
    label: "Researchers"
    label_singular: "Researcher"
    folder: "content/people/researchers"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Full Name", name: "title", widget: "string" }
      - { label: "Degree / Role", name: "phd", widget: "string" }
      - { label: "Institution", name: "institution", widget: "string" }
      - { label: "Photo", name: "photo", widget: "image", required: false }
      - { label: "Personal Website URL", name: "personal_url", widget: "string", required: false }
      - { label: "Display Order", name: "weight", widget: "number", default: 99 }

  # ── Students ───────────────────────────────────────────────
  - name: "students"
    label: "Students"
    label_singular: "Student"
    folder: "content/people/students"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Full Name", name: "title", widget: "string" }
      - { label: "Degree / Role", name: "phd", widget: "string", hint: "e.g. Ph.D Candidate" }
      - { label: "Advisor", name: "advisor", widget: "string", hint: "e.g. Rodrigo De Losso" }
      - { label: "Photo", name: "photo", widget: "image", required: false }
      - { label: "Display Order", name: "weight", widget: "number", default: 99 }

  # ── Alumni ────────────────────────────────────────────────
  - name: "alumni"
    label: "Alumni"
    label_singular: "Alumnus"
    folder: "content/people/alumni"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Full Name", name: "title", widget: "string" }
      - { label: "Degree", name: "degree", widget: "string", hint: "e.g. MSc in Economics" }
      - { label: "Advisor", name: "advisor", widget: "string" }

  # ── Published Papers ───────────────────────────────────────
  - name: "papers"
    label: "Published Papers"
    label_singular: "Paper"
    folder: "content/research/papers"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Journal", name: "journal", widget: "string" }
      - { label: "Year", name: "year", widget: "string", required: false }
      - { label: "Authors", name: "authors", widget: "string" }
      - { label: "Paper URL (DOI or SSRN)", name: "paper_url", widget: "string" }
      - { label: "Display Order", name: "weight", widget: "number", default: 99 }

  # ── Working Papers ─────────────────────────────────────────
  - name: "working-papers"
    label: "Working Papers"
    label_singular: "Working Paper"
    folder: "content/research/working-papers"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Authors", name: "authors", widget: "string" }
      - { label: "Paper URL (SSRN)", name: "paper_url", widget: "string" }
      - { label: "Display Order", name: "weight", widget: "number", default: 99 }

  # ── Insights (essays / crônicas) ───────────────────────────
  - name: "insights"
    label: "Insights"
    label_singular: "Post"
    folder: "content/insights"
    create: true
    slug: "{{slug}}"
    sortable_fields: ["date", "title"]
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Date", name: "date", widget: "datetime", format: "YYYY-MM-DD", date_format: "DD/MM/YYYY", time_format: false }
      - label: "Language"
        name: "language"
        widget: "select"
        default: "pt"
        options:
          - { label: "Português", value: "pt" }
          - { label: "English", value: "en" }
      - { label: "Guest Author", name: "author", widget: "string", hint: "Full name of the invited researcher, as it should appear in the byline." }
      - { label: "Author Affiliation", name: "author_affiliation", widget: "string", required: false, hint: "e.g. Professor of Finance, FGV-EAESP" }
      - { label: "Author Website", name: "author_url", widget: "string", required: false, hint: "Personal page, Google Scholar or SSRN profile." }
      - { label: "Author Photo", name: "author_photo", widget: "image", required: false }
      - { label: "Author Bio", name: "author_bio", widget: "text", required: false, hint: "Two or three lines shown in the box at the end of the text." }
      - { label: "Summary", name: "summary", widget: "text", hint: "One or two sentences shown on the listing card." }
      - label: "Topics"
        name: "topics"
        widget: "list"
        required: false
        field: { label: "Topic", name: "topic", widget: "string" }
        hint: "e.g. Asset Pricing, Short Selling, Mercado Brasileiro"
      - { label: "Social Preview Image", name: "image", widget: "image", required: false, hint: "Shown when the post is shared on LinkedIn, X or WhatsApp. Ideally 1200×630 px. Falls back to the author photo." }
      - { label: "Draft (not published)", name: "draft", widget: "boolean", default: false, required: false }
      - { label: "Text", name: "body", widget: "markdown" }

  # ── Datasets ───────────────────────────────────────────────
  - name: "datasets"
    label: "Data Pages"
    label_singular: "Dataset"
    folder: "content/datasets"
    create: false
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Short Summary (card text)", name: "summary", widget: "text" }
      - { label: "Description (page intro)", name: "description", widget: "text" }
      - { label: "Last observation in the data", name: "last_observation", widget: "date", format: "YYYY-MM-DD", required: false, hint: "The date of the LAST ROW of the data file — not the day you uploaded it. The freshness badge on the site is computed from this." }
      - { label: "First observation in the data", name: "coverage_start", widget: "date", format: "YYYY-MM-DD", required: false }
      - label: "Frequency"
        name: "frequency"
        widget: "select"
        required: false
        options: ["Daily", "Weekly", "Monthly", "Quarterly"]
      - { label: "No data file published", name: "no_data", widget: "boolean", default: false, required: false, hint: "Tick when only the methodology is available. The page will say so explicitly." }
      - label: "Download Links"
        name: "downloads"
        widget: "list"
        fields:
          - { label: "Label", name: "label", widget: "string" }
          - { label: "URL", name: "url", widget: "string" }
      - label: "Data Table"
        name: "table"
        widget: "object"
        required: false
        collapsed: true
        fields:
          - label: "Column Headers"
            name: "headers"
            widget: "list"
            field: { label: "Header", name: "header", widget: "string" }
          - label: "Rows"
            name: "rows"
            widget: "list"
            field:
              label: "Row"
              name: "row"
              widget: "list"
              field: { label: "Cell", name: "cell", widget: "string" }
      - { label: "Table Caption", name: "table_caption", widget: "string", required: false }
      - { label: "Show Interactive Dashboard (charts)", name: "dashboard", widget: "boolean", default: false, required: false }
      - { label: "Dashboard CSV Path", name: "dashboard_csv", widget: "string", required: false, hint: "e.g. /nefindata/risk-factors/nefin_factors.csv" }
